<div class="container mt-5 mb-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-lg border-0 rounded-4">
        <div class="card-body p-4">
          <h2 class="text-center mb-4 text-primary fw-bold">Reactive Form</h2>

          <form [formGroup]="contactForm" (ngSubmit)="submitForm()">
            <!-- Name -->
            <div class="mb-3">
              <label for="name" class="form-label">Full Name</label>
              <input
                type="text"
                id="name"
                formControlName="name"
                class="form-control"
                placeholder="Enter your full name"
              />
              <div
                *ngIf="contactForm.get('name')?.invalid && contactForm.get('name')?.touched"
                class="text-danger small mt-1"
              >
                Name is required.
              </div>
            </div>

            <!-- Email -->
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input
                type="email"
                id="email"
                formControlName="email"
                class="form-control"
                placeholder="Enter your email address"
              />
              <div
                *ngIf="contactForm.get('email')?.invalid && contactForm.get('email')?.touched"
                class="text-danger small mt-1"
              >
                Valid email is required.
              </div>
            </div>

            <!-- Phone -->
            <div class="mb-3">
              <label for="phone" class="form-label">Phone Number</label>
              <input
                type="tel"
                id="phone"
                formControlName="phone"
                class="form-control"
                placeholder="Enter your phone number"
              />
              <div
                *ngIf="contactForm.get('phone')?.invalid && contactForm.get('phone')?.touched"
                class="text-danger small mt-1"
              >
                Phone number is required.
              </div>
            </div>

            <!-- Subject -->
            <div class="mb-3">
              <label for="subject" class="form-label">Subject</label>
              <input
                type="text"
                id="subject"
                formControlName="subject"
                class="form-control"
                placeholder="Enter subject"
              />
            </div>

            <!-- Message -->
            <div class="mb-3">
              <label for="message" class="form-label">Message</label>
              <textarea
                id="message"
                formControlName="message"
                rows="4"
                class="form-control"
                placeholder="Write your message here..."
              ></textarea>
              <div
                *ngIf="contactForm.get('message')?.invalid && contactForm.get('message')?.touched"
                class="text-danger small mt-1"
              >
                Message cannot be empty.
              </div>
            </div>

            <!-- Submit -->
            <div class="d-grid">
              <button
                type="submit"
                class="btn btn-primary btn-lg rounded-pill"
                [disabled]="contactForm.invalid"
              >
                Send Message
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
