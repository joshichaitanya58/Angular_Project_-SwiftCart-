
<div class="container mt-4">
  <h2 class="mb-4">Users from API</h2>
  <div *ngIf="users; else loading" class="table-responsive">
    <table class="table table-striped table-bordered table-hover">
      <thead class="thead-dark">
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Username</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Website</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td>{{ user.id }}</td>
          <td>{{ user.name }}</td>
          <td>{{ user.username }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.phone }}</td>
          <td><a [href]="'http://' + user.website" target="_blank">{{ user.website }}</a></td>
        </tr>
      </tbody>
    </table>
  </div>
  <ng-template #loading>
    <p>Loading users...</p>
  </ng-template>
</div>
